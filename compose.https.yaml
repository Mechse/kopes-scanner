# Standalone VPS only. Do not add this override to Coolify deployments.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?Set the public DNS hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [outbound]
    depends_on: [scanner]
    security_opt: [no-new-privileges:true]
volumes:
  caddy-data: {}
  caddy-config: {}
