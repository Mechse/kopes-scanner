# Explicit pilot overlay. Do not enable until the documented worker acceptance checks pass.
# Public vulnerability DB snapshot must be prepared outside this worker, with db/metadata.json.
services:
  scanner:
    environment:
      KOPES_SOURCE_PILOT: '1'
      KOPES_SOURCE_SCAN_PILOT: '1'
      KOPES_SOURCE_SPOOL: /source
    volumes:
      - source-input:/source/in
      - source-output:/source/out
  source-worker:
    build:
      context: .
      dockerfile: Dockerfile.source-worker
    restart: unless-stopped
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 1.0
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - source-input:/spool/in:ro
      - source-output:/spool/out
      - ${KOPES_SOURCE_DB_DIR:?Provide a read-only public Trivy DB snapshot}:/db:ro
volumes:
  source-input: {}
  source-output: {}
