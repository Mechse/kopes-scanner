name: kopes
services:
  scanner:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      # Coolify generates these fallback values; local installs supply .env values.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-${SERVICE_URL_SCANNER_3100}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-${SERVICE_PASSWORD_64_AUTH}}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_ADMIN_USER: ${GITHUB_ADMIN_USER:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL:-}
      SMTP_URL: ${SMTP_URL:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      DOCKER_HOST: http://socket-proxy:2375
      KOPES_COOLIFY_URL: ${KOPES_COOLIFY_URL:-}
      COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN:-}
      DATA_DIR: /data
      HOST_ROOT: /host
    expose:
      - '3100'
    volumes:
      - scanner-data:/data
      - type: bind
        source: /
        target: /host
        read_only: true
        bind:
          # / includes Docker's data root; Docker requires slave/shared propagation.
          propagation: rslave
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      # A read-only root bind still allows Unix socket connections. Hide standard
      # runtime sockets and host process/device paths, in addition to running non-root.
      - /host/run:ro,size=64k,mode=0555
      - /host/var/run:ro,size=64k,mode=0555
      - /host/proc:ro,size=64k,mode=0555
      - /host/sys:ro,size=64k,mode=0555
      - /host/dev:ro,size=64k,mode=0555
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 2g
    cpus: 1.0
    stop_grace_period: 30s
    networks: [proxy, outbound]
    depends_on: [socket-proxy]
  socket-proxy:
    build:
      context: .
      dockerfile: Dockerfile.socket-proxy
    user: '0:0'
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 64m
    networks: [proxy]
    # Never publish the Docker API port to the host or attach an ingress network.
networks:
  proxy:
    internal: true
  outbound: {}
volumes:
  scanner-data: {}
