global
    log stdout format raw local0
    maxconn 32
    nbthread 1

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 24h
    timeout server 24h
    # Dev reloads disconnect quiet /events streams. Reclaim half-closed sockets
    # promptly so abandoned streams cannot exhaust the 32 connection slots.
    timeout client-fin 1s
    timeout server-fin 1s

frontend docker_read_only
    bind :2375
    # Only discovery, events and image export/metadata. Even GET container
    # archives, logs and exec endpoints are intentionally not exposed.
    acl read_method method GET HEAD
    acl allowed_path path_reg ^(/v[0-9]+[.][0-9]+)?/(_ping|version|containers/json|events|images/get)$
    acl allowed_path path_reg ^(/v[0-9]+[.][0-9]+)?/images/(sha256:|sha256%3[Aa])?[a-f0-9]{64}/(json|history)$
    http-request deny deny_status 403 unless read_method allowed_path
    default_backend docker

backend docker
    server engine /var/run/docker.sock
